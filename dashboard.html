<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Dashboard</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

<nav class="navbar">
  <a href="dashboard.html">
    <img src="imgs/lets-study.png" class="logo-icon">
  </a>

  <input type="date" id="dataFiltro" class="filtro-topo">

  <span class="frase">Bons estudos :)</span>
  <a href="estatisticas.html">Estatísticas</a>
  <a href="tarefas.html">Tarefas</a>
  <a href="sobre.html">Sobre</a>
  <a href="perfil.html">Perfil</a>
</nav>

<div class="container">

  <!-- 🔢 MÉTRICAS -->
  <div class="stats">

    <div class="stat-card">Horário Atual
      <div id="horarioAtual" class="stat-card-in">3h 45m</div>
    </div>

    <div class="stat-card">Tempo de Foco
      <div id="tempoFoco" class="stat-card-in"></div>
    </div>

    <div class="stat-card">Progresso Tasks
      <div id="tasksProgresso" class="stat-card-in"></div>
    </div>

  </div>

  <!-- 📊 CONTEÚDO PRINCIPAL -->
  <div class="main-grid">

    <!-- 📋 TASKS -->
    <div class="card tasks-card">
      <h2>Tarefas</h2>
      <div id="listaTarefas"></div>
      <button onclick="window.location.href='nova-tarefa.html'" class="btn-primary">+</button>
    </div>

    <!-- ⏱️ TIMER -->
    <div class="card timer-card">

    <div class="task-selected">
      <h3 id="taskTitulo">Selecione uma tarefa</h3>

      <div id="taskBadges" class="task-selected-badges"></div>

      <div id="taskInfo" class="task-selected-info"></div>

      <p id="taskNotas" class="task-selected-notes"></p>
    </div>

    <div class="timer-display" id="timer">
      00:00:00
    </div>

    <div class="timer-actions">
      <button id="btnIniciar">Iniciar</button>
      <button id="btnSalvar" class="btn-secondary">Salvar</button>
    </div>

    </div>

  </div>

</div>

<script type="module" src="js/dash.js"></script>

</body>
</html>
