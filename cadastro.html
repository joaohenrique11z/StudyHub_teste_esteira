<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Criar Conta - StudyHub</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body class="auth">

<div class="auth-layout">

  <!-- LADO ESQUERDO -->
  <div class="auth-left">
    <img src="imgs/lets-study.png" class="logo-big">
  </div>

  <!-- LADO DIREITO -->
  <div class="auth-right">
    <div class="card-auth">

      <h1>Criar Conta</h1>
      <p class="subtitle">Comece a organizar seus estudos</p>

      <input type="email" id="email" placeholder="Email">
      <input type="password" id="senha" placeholder="Senha">

      <button onclick="cadastrar()">Cadastrar</button>

      <!-- LINK -->
      <p class="link" onclick="window.location.href='index.html'">Já tenho conta</p>

      <!-- ERRO -->
      <p id="erro" class="erro"></p>

    </div>
  </div>

</div>

<script type="module" src="js/auth.js"></script>

</body>
