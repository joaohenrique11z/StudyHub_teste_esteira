<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Perfil - StudyHub</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

<nav class="navbar">
  <a href="dashboard.html">
    <img src="imgs/lets-study.png" class="logo-icon" alt="StudyHub">
  </a>
  <span class="frase">Bons estudos :)</span>
  <a href="estatisticas.html">Estatísticas</a>
  <a href="tarefas.html">Tarefas</a>
  <a href="dicas.html">Dicas</a>
  <a href="musicas.html">Músicas</a>
  <a href="sobre.html">Sobre</a>
  <a href="perfil.html">Perfil</a>
</nav>

<div class="container">
  <div class="card">
    <h2>Perfil do Usuário</h2>
    
    <!-- Exibe o email do usuário logado -->
    <p id="emailUsuario">Carregando...</p>

    <!-- Botão de logout -->
    <button id="btnLogout" class="btn-secondary">Sair da conta</button>
  </div>
</div>

<footer style="text-align: center; padding: 30px; color: #555; font-size: 13px;">
  LetsStudy – Seu espaço de produtividade
</footer>

<script type="module">
  import { supabase } from './js/supabase.js';
  import { protegerPagina } from './js/guard.js';

  await protegerPagina();

  // Obtém dados do usuário autenticado
  const { data } = await supabase.auth.getUser();
  if (data.user) {
    document.getElementById("emailUsuario").innerText = `Email: ${data.user.email}`;
  }

  // Configura logout
  document.getElementById("btnLogout").addEventListener("click", async () => {
    await supabase.auth.signOut();
    window.location.href = "index.html";
  });
</script>
</body>
</html>
