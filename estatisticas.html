<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Estatísticas - StudyHub</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

<nav class="navbar">
  <a href="dashboard.html">
    <img src="imgs/lets-study.png" class="logo-icon" alt="StudyHub">
  </a>
  <span class="frase">Bons estudos :)</span>
  <a href="estatisticas.html">Estatísticas</a>
  <a href="tarefas.html">Tarefas</a>
  <a href="dicas.html">Dicas</a>
  <a href="musicas.html">Músicas</a>
  <a href="sobre.html">Sobre</a>
  <a href="perfil.html">Perfil</a>
</nav>

<div class="container">
  <h1 style="margin-bottom: 20px;">📊 Estatísticas de Estudo</h1>

  <!-- Grid de dois cards: resumo e resumo geral -->
  <div class="stats-grid">
    <!-- Card: Matéria mais estudada -->
    <div class="card">
      <h2>🏆 Matéria Mais Estudada</h2>
      <p id="topMateria" style="font-size: 16px; margin-top: 10px;">Carregando...</p>
    </div>

    <!-- Card: Resumo geral (tempo total, dia top, média) -->
    <div class="card">
      <h2>📈 Resumo Geral</h2>
      <p id="tempoTotal" style="margin-top: 12px;"></p>
      <p id="diaTop"></p>
      <p id="mediaDiaria"></p>
    </div>
  </div>

  <!-- Card: Gráfico de tempo por matéria -->
  <div class="card" style="margin-top: 20px;">
    <h2>📚 Tempo por Matéria</h2>
    <canvas id="graficoTarefas" width="400" height="200" style="margin-top: 15px;"></canvas>
  </div>
</div>

<footer style="text-align: center; padding: 30px; color: #555; font-size: 13px;">
  LetsStudy – Seu espaço de produtividade
</footer>

<!-- Bibliotecas e scripts -->
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script type="module">
  import { protegerPagina } from './js/guard.js';
  await protegerPagina();
</script>
<script type="module" src="js/estatisticas.js"></script>
</body>
</html>
