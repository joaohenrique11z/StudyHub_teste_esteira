<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - LetsStudy</title>
  <link rel="stylesheet" href="css/styles.css">
  <link rel="icon" type="image/png" href="imgs/icon.png">
</head>
<body class="auth">

<!-- ============================================= -->
<!-- LAYOUT DE AUTENTICAÇÃO (LOGIN)                 -->
<!-- ============================================= -->
<div class="auth-layout">
  
  <!-- LADO ESQUERDO: LOGO GRANDE -->
  <div class="auth-left">
    <img src="imgs/lets-study.png" alt="Logo StudyHub" class="logo-big">
  </div>

  <!-- LADO DIREITO: FORMULÁRIO DE LOGIN -->
  <div class="auth-right">
    <div class="card-auth">
      <h1>Login</h1>
      <p class="subtitle">Bem-vindo de volta!<br>Organize seus estudos com eficiência</p>

      <!-- Campos de entrada -->
      <input type="email" id="email" placeholder="Email" autocomplete="email">
      <input type="password" id="senha" placeholder="Senha" autocomplete="current-password">

      <!-- Botão de ação (chama função global login() definida em auth.js) -->
      <button onclick="login()">Entrar</button>

      <!-- Link para página de cadastro -->
      <p class="link" onclick="irCadastro()">Criar conta</p>

      <!-- Exibição de mensagens de erro -->
      <p id="erro" class="erro"></p>
    </div>
  </div>
</div>

<!-- Script principal de autenticação -->
<script type="module" src="js/auth.js"></script>
</body>
</html>
